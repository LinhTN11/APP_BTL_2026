    "/v1/auth/otp/request": {
      "post": {
        "summary": "Demo OTP; 5 requests / phone / 15 minutes; no SMS",
        "operationId": "post_v1_auth_otp_request",
        "security": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "phone": {
                    "type": "string",
                    "pattern": "^\\+[1-9][0-9]{7,14}$"
                  }
                },
                "required": [
                  "phone"
                ]
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "properties": {
                    "data": {
                      "type": "object",
                      "additionalProperties": false,
                      "properties": {
                        "challengeId": {
                          "type": "string",
                          "format": "uuid"
                        },
                        "expiresAt": {
                          "type": "string",
                          "format": "date-time"
                        },
                        "mode": {
                          "const": "demo"
                        },
                        "demoCode": {
                          "type": "string",
                          "pattern": "^[0-9]{6}$"
                        }
                      },
                      "required": [
                        "challengeId",
                        "expiresAt",
                        "mode",
                        "demoCode"
                      ]
                    }
                  },
                  "required": [
                    "data"
                  ]
                }
              }
            }
          },
          "400": {
