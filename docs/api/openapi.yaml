        "tags": [
          "Tài khoản thử nghiệm"
        ],
        "security": [],
        "responses": {
          "200": {
            "description": "Thành công",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "properties": {
                    "data": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "additionalProperties": false,
                        "properties": {
                          "account": {
                            "type": "string",
                            "enum": [
                              "A",
                              "B",
                              "C",
