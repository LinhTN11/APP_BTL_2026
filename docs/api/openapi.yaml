                },
                "example": {
                  "error": {
                    "code": "RATE_LIMIT",
                    "message": "Quá nhiều yêu cầu",
                    "requestId": "req-example-001"
                  }
                }
              }
            }
          }
        }
      }
    },
    "/v1/auth/otp/request": {
      "post": {
        "summary": "Yêu cầu mã OTP mô phỏng trong emulator",
        "operationId": "postV1AuthOtpRequest",
        "tags": [
          "Tài khoản thử nghiệm"
        ],
        "description": "Không gửi SMS. Chỉ chế độ emulator trả demoCode; cloud trả 503. Mã thử không xác minh quyền sở hữu số điện thoại.",
        "security": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "phone": {
                    "type": "string",
                    "pattern": "^\\+[1-9][0-9]{7,14}$"
                  }
                },
                "required": [
                  "phone"
                ]
              },
              "example": {
                "phone": "+84912345678"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Thành công",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "properties": {
                    "data": {
                      "type": "object",
                      "additionalProperties": false,
                      "properties": {
                        "challengeId": {
                          "type": "string",
                          "format": "uuid"
                        },
                        "expiresAt": {
                          "type": "string",
                          "format": "date-time"
                        },
                        "mode": {
                          "const": "demo"
                        },
                        "demoCode": {
                          "type": "string",
                          "pattern": "^[0-9]{6}$"
                        }
                      },
                      "required": [
                        "challengeId",
                        "expiresAt",
                        "mode",
                        "demoCode"
                      ]
                    }
                  },
                  "required": [
                    "data"
                  ]
                }
              }
            }
          },
          "400": {
            "description": "Dữ liệu request không qua xác thực schema hoặc quy tắc đầu vào.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                },
                "example": {
                  "error": {
                    "code": "VALIDATION_ERROR",
                    "message": "Dữ liệu yêu cầu không hợp lệ",
                    "requestId": "req-example-001"
                  }
                }
              }
            }
          },
          "429": {
            "description": "Vượt giới hạn tần suất; xem header Retry-After.",
            "headers": {
              "Retry-After": {
                "schema": {
                  "type": "string",
                  "example": "60"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                },
                "example": {
                  "error": {
                    "code": "RATE_LIMIT",
                    "message": "Quá nhiều yêu cầu",
                    "requestId": "req-example-001"
                  }
                }
              }
            }
          },
          "503": {
            "description": "Provider hoặc chế độ demo không khả dụng trong runtime hiện tại.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                },
                "example": {
                  "error": {
                    "code": "PROVIDER_UNAVAILABLE",
                    "message": "Provider chưa khả dụng",
                    "requestId": "req-example-001"
                  }
                }
              }
            }
          }
        }
      }
    },
    "/v1/auth/otp/verify": {
      "post": {
        "summary": "Xác minh mã OTP mô phỏng trong emulator",
        "operationId": "postV1AuthOtpVerify",
        "tags": [
          "Tài khoản thử nghiệm"
        ],
        "description": "Mã chỉ dùng trong emulator/demo; cloud không cấu hình SMS và trả 503. Response chứa session nên không có example token.",
        "security": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "challengeId": {
                    "type": "string",
                    "format": "uuid"
                  },
                  "code": {
                    "type": "string",
                    "pattern": "^[0-9]{6}$"
                  }
                },
                "required": [
                  "challengeId",
                  "code"
                ]
              },
              "example": {
                "challengeId": "00000000-0000-4000-8000-000000000001",
                "code": "000000"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Thành công",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "properties": {
                    "data": {
                      "$ref": "#/components/schemas/Session"
                    }
                  },
                  "required": [
                    "data"
                  ]
                }
              }
            }
          },
          "400": {
            "description": "Dữ liệu request không qua xác thực schema hoặc quy tắc đầu vào.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                },
                "example": {
                  "error": {
                    "code": "VALIDATION_ERROR",
                    "message": "Dữ liệu yêu cầu không hợp lệ",
                    "requestId": "req-example-001"
                  }
                }
              }
            }
          },
          "401": {
            "description": "Bearer session thiếu, hết hạn, bị thu hồi hoặc không hợp lệ.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                },
                "example": {
                  "error": {
                    "code": "SESSION_EXPIRED",
                    "message": "Phiên đăng nhập không còn hiệu lực",
                    "requestId": "req-example-001"
                  }
                }
              }
            }
          },
          "429": {
            "description": "Vượt giới hạn tần suất; xem header Retry-After.",
            "headers": {
              "Retry-After": {
                "schema": {
                  "type": "string",
                  "example": "60"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                },
                "example": {
                  "error": {
                    "code": "RATE_LIMIT",
                    "message": "Quá nhiều yêu cầu",
                    "requestId": "req-example-001"
                  }
                }
              }
            }
          },
          "503": {
            "description": "Provider hoặc chế độ demo không khả dụng trong runtime hiện tại.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                },
                "example": {
                  "error": {
                    "code": "PROVIDER_UNAVAILABLE",
                    "message": "Provider chưa khả dụng",
                    "requestId": "req-example-001"
                  }
                }
              }
            }
          }
        }
      }
    },
