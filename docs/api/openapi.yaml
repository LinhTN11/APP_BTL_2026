            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                },
                "example": {
                  "error": {
                    "code": "RATE_LIMIT",
                    "message": "Quá nhiều yêu cầu",
                    "requestId": "req-example-001"
                  }
                }
              }
