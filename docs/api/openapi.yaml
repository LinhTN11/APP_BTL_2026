  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "description": "API session opaque do POST /v1/auth/firebase trả về. Chỉ hash của session được lưu trong Firestore; mặc định 24 giờ và có thể thu hồi bằng logout. Đây không phải Firebase ID token."
      }
    },
    "schemas": {
      "User": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "displayName": {
            "type": "string",
            "minLength": 1,
            "maxLength": 80
          }
        },
        "required": [
          "id",
          "displayName"
        ]
      },
      "Media": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "kind": {
            "type": "string",
            "enum": [
              "image"
            ]
          },
          "url": {
            "type": "string",
            "minLength": 1,
            "maxLength": 300
          },
          "position": {
            "type": "integer"
          }
        },
        "required": [
          "id",
          "kind",
          "url",
          "position"
        ]
      },
      "PublicProfile": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "userId": {
            "type": "string",
            "format": "uuid"
          },
          "displayName": {
            "type": "string",
            "minLength": 1,
            "maxLength": 80
          },
          "age": {
            "type": "integer"
          },
          "gender": {
            "type": "string",
            "enum": [
              "female",
              "male",
              "other"
            ]
          },
          "bio": {
            "type": "string"
          },
          "datingGoal": {
            "type": "string",
            "enum": [
              "relationship",
              "friendship",
              "casual",
              "unsure"
            ]
          },
          "interests": {
