        "description": "Chỉ hoạt động khi bật emulator/demo tường minh; cloud trả 404. Không dùng trong đăng nhập sản phẩm.",
        "security": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "account": {
                    "type": "string",
                    "enum": [
                      "A",
                      "B",
                      "C",
