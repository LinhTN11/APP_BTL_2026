{
  "openapi": "3.1.0",
  "info": {
    "title": "Gặp API — Firestore core",
    "version": "0.2.0",
    "description": "API hiện thực P01–P05 bằng Cloud Firestore. Dữ liệu demo chỉ hoạt động khi bật emulator rõ ràng. Các thao tác tạo mới và retry idempotent thành công trả HTTP 200. Client đăng nhập bằng Firebase Authentication SDK rồi đổi Firebase ID token lấy API session opaque; API không nhận mật khẩu. Email chưa được xác minh quyền sở hữu. OTP/SMS, xác minh selfie và catalog GIF/sticker chỉ mô phỏng trong emulator hoặc không khả dụng ở cloud. Bytes ảnh nằm trên filesystem của máy chạy BE, không đồng bộ chỉ nhờ Firestore."
  },
  "servers": [
    {
      "url": "/",
      "description": "Cùng origin với API đang chạy"
    }
  ],
  "tags": [
    {
      "name": "Hệ thống",
      "description": "Health và khả năng của runtime hiện tại."
    },
    {
      "name": "Tài khoản thử nghiệm",
      "description": "Tài khoản giả; chỉ bật trong emulator/demo tường minh."
    },
    {
      "name": "Xác thực",
      "description": "Firebase SDK và session API; không gửi mật khẩu tới API."
    },
    {
      "name": "Hồ sơ và ảnh",
      "description": "Hồ sơ, ảnh và trạng thái xác minh mô phỏng."
    },
    {
      "name": "Hồ sơ và khám phá",
      "description": "Hồ sơ cá nhân, hồ sơ công khai và bộ lọc."
    },
    {
      "name": "Vị trí và khám phá",
      "description": "Consent vị trí riêng và trang discovery."
    },
    {
      "name": "Tương tác và Match",
      "description": "Swipe và vòng đời Match."
    },
    {
      "name": "Trò chuyện",
      "description": "Tin nhắn REST và catalog thử nghiệm."
    },
    {
      "name": "An toàn",
      "description": "Block và tiếp nhận report; chưa có moderation API."
    }
  ],
  "security": [
    {
      "bearerAuth": []
    }
  ],
  "paths": {
    "/health": {
      "get": {
        "summary": "Kiểm tra tình trạng API và cơ sở dữ liệu",
        "operationId": "getHealth",
        "tags": [
          "Hệ thống"
        ],
        "security": [],
        "responses": {
          "200": {
            "description": "Thành công",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "properties": {
                    "data": {
                      "type": "object",
                      "additionalProperties": false,
                      "properties": {
                        "status": {
                          "const": "ok"
                        },
                        "database": {
                          "type": "object",
                          "additionalProperties": false,
                          "properties": {
                            "provider": {
                              "const": "firestore",
                              "type": "string"
                            },
                            "mode": {
                              "type": "string",
                              "enum": [
                                "cloud",
                                "emulator"
                              ]
                            },
                            "projectId": {
                              "type": "string",
                              "minLength": 1,
                              "maxLength": 200
                            },
                            "namespace": {
                              "type": "string",
                              "minLength": 1,
                              "maxLength": 48
                            }
                          },
                          "required": [
                            "provider",
                            "mode",
                            "projectId",
                            "namespace"
                          ]
                        },
                        "version": {
                          "type": "string",
                          "minLength": 1,
                          "maxLength": 200
                        }
                      },
                      "required": [
                        "status",
                        "database",
                        "version"
                      ]
                    }
                  },
                  "required": [
                    "data"
                  ]
                },
                "example": {
                  "data": {
                    "status": "ok",
                    "database": {
                      "provider": "firestore",
                      "mode": "cloud",
                      "projectId": "sample-project",
                      "namespace": "sample-app"
                    },
                    "version": "0.2.0"
                  }
                }
              }
            }
          },
          "429": {
            "description": "Vượt giới hạn tần suất; xem header Retry-After.",
            "headers": {
              "Retry-After": {
                "schema": {
                  "type": "string",
                  "example": "60"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                },
                "example": {
                  "error": {
                    "code": "RATE_LIMIT",
                    "message": "Quá nhiều yêu cầu",
                    "requestId": "req-example-001"
                  }
                }
              }
            }
          }
        }
      }
    },
    "/v1/capabilities": {
      "get": {
        "summary": "Liệt kê chế độ hoạt động hiện tại của API và provider",
        "operationId": "getV1Capabilities",
        "tags": [
          "Hệ thống"
        ],
        "description": "Mode phản ánh cấu hình runtime. `demo` là mô phỏng có nhãn; `unavailable` nghĩa là provider không hoạt động. Không xem capability là bằng chứng mọi account/provider đã được kiểm thử.",
        "security": [],
        "responses": {
          "200": {
            "description": "Thành công",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "properties": {
                    "data": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "additionalProperties": false,
                        "properties": {
                          "name": {
                            "type": "string",
                            "minLength": 1,
                            "maxLength": 200
                          },
                          "mode": {
                            "type": "string",
                            "enum": [
                              "real",
                              "demo",
                              "unavailable"
                            ]
                          },
                          "reason": {
                            "type": "string"
                          },
                          "provider": {
                            "const": "firestore",
                            "type": "string"
                          },
                          "databaseMode": {
                            "type": "string",
                            "enum": [
                              "cloud",
                              "emulator"
                            ]
                          },
                          "projectId": {
                            "type": "string",
                            "minLength": 1,
                            "maxLength": 200
                          },
                          "namespace": {
                            "type": "string",
                            "minLength": 1,
                            "maxLength": 48
                          },
                          "storage": {
                            "type": "string",
                            "minLength": 1,
                            "maxLength": 200
                          },
                          "notice": {
                            "type": "string"
                          }
                        },
                        "required": [
                          "name",
                          "mode"
                        ]
                      }
                    }
                  },
                  "required": [
                    "data"
                  ]
                }
              }
            }
          },
          "429": {
            "description": "Vượt giới hạn tần suất; xem header Retry-After.",
            "headers": {
              "Retry-After": {
                "schema": {
                  "type": "string",
                  "example": "60"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                },
                "example": {
                  "error": {
                    "code": "RATE_LIMIT",
                    "message": "Quá nhiều yêu cầu",
                    "requestId": "req-example-001"
                  }
                }
              }
            }
          }
        }
      }
    },
    "/v1/demo/accounts": {
      "get": {
        "summary": "Liệt kê tài khoản hư cấu trong chế độ emulator demo",
