name: Secret guard

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  scan-outgoing-history:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0
      - name: Run secret guard regression tests
        run: node --test scripts/security/test/*.test.mjs
      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/security/secret-guard.mjs range "$BASE_SHA" "$HEAD_SHA"
      - name: Scan pushed commits
        if: github.event_name == 'push' && !startsWith(github.event.after, '0000000000000000000000000000000000000000')
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.after }}
        run: node scripts/security/secret-guard.mjs range "$BASE_SHA" "$HEAD_SHA"
